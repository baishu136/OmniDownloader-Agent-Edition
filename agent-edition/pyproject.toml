[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "omnidownloader-agent"
version = "0.1.0"
description = "Headless MCP and bot delivery edition of OmniDownloader"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.3,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "cryptography>=44", "requests>=2.32,<3", "yt-dlp[default]", "PySocks>=1.7",
  "imageio-ffmpeg>=0.6", "pillow>=11", "gallery-dl==1.32.20"
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.5,<2", "pyinstaller>=6.22,<7", "aiofiles>=25", "pystray>=0.19; sys_platform == 'win32'"]

[project.scripts]
omni-agent = "omni_agent.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.package-data]
omni_agent = ["static/*"]

[tool.setuptools.packages.find]
include = ["omni_agent*"]
